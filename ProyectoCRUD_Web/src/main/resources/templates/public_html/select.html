<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SELECT - CRUD Básico en SpringBoot | Programación Web 2026A</title>
  <link rel="stylesheet" th:href="@{/CSS/insert_styles.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <header>
    <nav class="navbar  navbar-expand-lg border-bottom border-body" data-bs-theme="dark" style="background-color: #000;">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <a class="navbar-brand" href="#"><img th:src="@{/Images/HPED_Logo.svg}" alt="&lt; HPED &gt;" class="logotipo"></img></a>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" th:href="@{/lista}">LISTA DE ALUMNOS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/insert}">INSERT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" th:href="@{/select}">SELECT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/update}">UPDATE</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/delete}">DELETE</a>
            </li>
          </ul>
          <div class="d-flex">
            <span class="navbar-text">Programación Web 2026A</span>
            <button class="btn btn-outline-success btn-nvoAlumno" type="submit">Añadir Alumno<i class="bi bi-plus-circle-fill"></i></button>
            <button class="btn btn-outline-success btn-cerrar" type="button"><i class="bi bi-box-arrow-left"></i></button>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <div class="top-center">
      <p class="info-top">
        ¡Hola!
      </p>
      <p class="info-top2">
        Por favor ingresa el código del alumno que buscas.
      </p>
    </div>
    <div class="form-content" id="formBuscar" th:unless="${not #strings.isEmpty(alumno.nombre)}">
      <form th:action="@{/select}" method="POST" class="crud-form" id="formBuscador">
        <div class="right-btn">
          <button type="button" class="btn-cerrar"><i class="bi bi-box-arrow-left"></i></button>
        </div>
        <div class="form-title">
          <h2>Buscar alumno</h2>
          <hr class="separator">
        </div>
        <div class="usr-bot">
          <label for="coUdeg">Codigo de estudiante:</label>
          <input type="number" id="coUdeg" name="codigo" placeholder="123456789" required>
        </div>
        <div class="usr-btn">
          <input type="submit" value="Buscar" id="btnBuscar">
        </div>
      </form>
    </div>
    <div class="modal-datos" id="modalDatos" th:if="${not #strings.isEmpty(alumno.nombre)}">
      <form th:action="@{/select}" th:object="${alumno}" class="crud-form">
        <div class="right-btn">
          <a th:href="@{/select}" class="btn-cerrar1"><i class="bi bi-x-circle"></i></a>
        </div>
        <div class="form-title">
          <h2>Datos de <span th:text="*{nombre}"></span></h2>
          <hr class="separator">
        </div>
        <div class="usr-top">
          <label for="name">Nombre:</label>
          <input type="text" th:field="*{nombre}" id="name" placeholder="Ej. HPED Dev" readonly="readonly">
        </div>
        <div class="usr-center">
          <label for="dom">Domicilio:</label>
          <input type="text" id="dom" th:field="*{domicilio}" placeholder="Ej. Domicilio Ficticio #23" readonly="readonly">
        </div>
        <div class="usr-bot">
          <label for="codUdeg">Codigo de estudiante:</label>
          <input type="number" id="codUdeg" th:field="*{codigo}" placeholder="123456789" readonly="readonly">
        </div>
      </form>
    </div>
  </main>
  <footer>
    <ul>
      <li>Hernández Pérez, Edgar Daniel - 221770108 - Universidad de Guadalajara</li>
      <li>
        <a href="https://github.com/HPED-SP11" target="_blank">
          <i class="bi bi-github"></i>
        </a>
        <a href="https://gitlab.com/hped" target="_blank">
          <i class="bi bi-gitlab"></i>
        </a>
        <a href="https://www.linkedin.com/in/edgar-perez-hped" target="_blank">
          <i class="bi bi-linkedin"></i>
        </a>
        <a href="https://bsky.app/profile/hped.bsky.social" target="_blank">
          <i class="bi bi-bluesky"></i>
        </a>
      </li>
    </ul>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script th:src="@{/JS/crudScripts.js}"></script>
</body>
</html>
