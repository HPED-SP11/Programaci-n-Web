  <main class="container">
    <div class="top-center">
      <p class="info-top">
        ¡Hola!
      </p>
      <p class="info-top2">
        Por favor ingresa los datos del alumno.
      </p>
    </div>
    <div class="form-content">
      <form th:action="@{/insert}" method="POST" class="crud-form">
        <div class="right-btn">
          <button type="button" class="btn-cerrar"><i class="bi bi-box-arrow-left"></i></button>
        </div>
        <div class="form-title">
          <h2>Datos personales</h2>
          <hr class="separator">
        </div>
        <div class="usr-top">
          <label for="name">Nombre:</label>
          <input type="text" id="name" name="nombre" placeholder="Ej. HPED Dev" required>
        </div>
        <div class="usr-center">
          <label for="dom">Domicilio:</label>
          <input type="text" id="dom" name="domicilio" placeholder="Ej. Domicilio Ficticio #23" required>
        </div>
        <div class="usr-bot">
          <label for="coUdeg">Codigo de estudiante:</label>
          <input type="number" id="coUdeg" name="codigo" placeholder="123456789" required>
        </div>
        <div class="usr-btn">
          <input type="submit" value="Registrar" id="btnRegistrar">
        </div>
      </form>
    </div>
